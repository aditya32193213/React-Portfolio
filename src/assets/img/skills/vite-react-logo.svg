<svg id="vite-react-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="vite-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#41D1FF"/>
                        <stop offset="100%" style="stop-color:#BD34FE"/>
                    </linearGradient>
                </defs>
                <rect width="200" height="200" fill="url(#vite-gradient)" rx="20"/>
                <!-- Vite lightning bolt -->
                <path d="M70 50 L90 90 L75 90 L95 140 L70 100 L85 100 Z" fill="#FFD028" stroke="#FFF" stroke-width="2"/>
                <!-- React atom -->
                <ellipse cx="130" cy="100" rx="35" ry="15" fill="none" stroke="#61DAFB" stroke-width="3" transform="rotate(60 130 100)"/>
                <ellipse cx="130" cy="100" rx="35" ry="15" fill="none" stroke="#61DAFB" stroke-width="3" transform="rotate(-60 130 100)"/>
                <ellipse cx="130" cy="100" rx="35" ry="15" fill="none" stroke="#61DAFB" stroke-width="3"/>
                <circle cx="130" cy="100" r="6" fill="#61DAFB"/>
                <!-- Labels -->
                <text x="70" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Vite</text>
                <text x="130" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#61DAFB" text-anchor="middle">React</text>
            </svg>